# Survivors of tests/mutation/mutate.py that have been looked at and are not
# test gaps. Every other survivor is one: a change to the code that no test
# notices.
#
#   kind = "equivalent"    the mutated code behaves exactly as the original,
#                          for every input the code can be given; `why` says
#                          why in one sentence.
#   kind = "code-problem"  the survivor shows the code itself is wrong or does
#                          nothing; listed for a decision, not fixed here.
#
# `signature` is what mutate.py prints beside the survivor: a hash of the
# module, the operator and the lines the mutation removes and adds, so it
# still matches when unrelated code above it moves. `mutant` is the changed
# line, for a person reading this file.

